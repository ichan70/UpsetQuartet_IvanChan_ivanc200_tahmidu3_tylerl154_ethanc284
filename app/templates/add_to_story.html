<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="The add to story page for the website.">
        <meta name="author" content="The Upset Quartet">
        <meta name="viewport" content="width=device.width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <title>Add to Story</title>
    </head>
    <body>
        <h4>Add to this story: {{ page[1] }}</h4>
        <p>{{ page[2] }}</p>
        <form action="/add_to_story/{{ page[0] }}" method="post">
            <h4>Your Text:</h4>
            <textarea name="text" required></textarea>
            <br> <br>
            <input type="submit" value="Add to Story">
            <a href="/user/{{ username }}">Cancel</a>
        </form>
    </body>
</html>
