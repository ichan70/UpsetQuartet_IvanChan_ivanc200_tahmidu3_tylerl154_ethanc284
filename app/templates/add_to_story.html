<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="The add to story page for the website.">
        <meta name="author" content="The Upset Quartet">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <title>Add to Story</title>
    </head>
    <body>
      <div class="edit-container">
        <h1 class="edit-heading">Add to this story: {{ page[1] }} by {{ page[3] }}</h1>
        {% if last_contribution %}
            <div class="existing-story">
                <p>{{ last_contribution[3] }} by {{ last_contribution[2] }}</p>
            </div>
        {% else %}
            <div class="existing-story">
                <p>{{ page[2] }}</p>
            </div>
        {% endif %}
        <form action="/add_to_story/{{ page[0] }}" method="post" class="edit-form">
          <textarea name="text" class="edit-textarea" placeholder="Enter Your Text" required></textarea>
          <div class="edit-buttons">
            <a href="/user/{{ username }}" class="btn-cancel">Cancel</a>
            <input type="submit" value="Add to Story" class="btn-publish">
          </div>
        </form>
      </div>
    </body>
</html>
