<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="The edit page for the website.">
        <meta name="author" content="The Upset Quartet">
        <meta name="viewport" content="width=device.width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <title>Edit Page</title>
    </head>
    <body>
        {% if page %} <!-- if-else check that either adds onto a story or creates a new story (jinja is weird af needing these percent signs idk man) -->
            <h4>Add onto this story: {{ page[1] }}</h4>
            <p>{{ page[2] }}</p>
        {% else %}
            <h4>Create a new story</h4>
        {% endif %}
        <form action="/edit" method="post">
            {% if not page %}
                <h4>Title:</h4>
                <input type="text" name="title" required>
            {% endif %}
            <h4>Text:</h4>
            <textarea name="text" required></textarea> <!-- text box for content, textarea is bigger than the one for title -->
            <input type="hidden" name="id" value="{{ page[0] if page else '' }}"> <!-- i made it hidden from the user but this create a page id or make it null -->
            <br> <br>
            <input type="submit" value="Publish">
            <a href="/user/{{ username }}">Cancel</a> <!-- i js added a link that brought back to profile page cuz i think its easier than deleting a dummy entry -->
        </form>
    </body>
</html>
