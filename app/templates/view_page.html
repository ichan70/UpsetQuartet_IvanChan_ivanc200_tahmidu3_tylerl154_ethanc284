<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="The view page for the website.">
        <meta name="author" content="The Upset Quartet">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <title>View Page</title>
    </head>
    <body>
        <div class="edit-container">
            <h1 class="edit-heading">{{ page[1] }} by {{ page[3] }}</h1>
            <div class="existing-story">
                <p>{{ page[2] }}</p>
            </div>
            <h3>Contributions:</h3>
            <ul>
                {% for contribution in contributions %}
                    <li><strong>{{ contribution[3] }}</strong> by {{ contribution[2] }} - Added on: {{ contribution[4] | format_time }}</li>
                {% endfor %}
            </ul>
            <a href="/user/{{ session['username'] }}"><button class="btn-cancel btn-large" style="font-size:20px;">Back to Profile</button></a>
            <a href="/add_to_story/{{ page[0] }}"><button class="btn-publish btn-large" style="font-size:20px;">Add to Story</button></a>
        </div>
    </body>
</html>
